# Place inside your EXISTING HTTPS server block. Replace example.org.
# viewer-gateway must be reachable only by this trusted reverse proxy.
location = /screen-viewer/ws {
    if ($http_origin != "https://libki.example.org") { return 403; }
    # Also apply your site's authenticated staff-network/access policy here.
    # Do not log bearer-token URLs (including in upstream/CDN/error logs).
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://viewer-gateway:6080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
